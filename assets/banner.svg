<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Bianca Andrade</title>
  <desc id="bannerDesc">Desenvolvedora Full Stack com foco em front-end e acessibilidade</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#121826;#0D1117" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#161b2e">
        <animate attributeName="stop-color" values="#161b2e;#1a2140;#161b2e" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0f1724">
        <animate attributeName="stop-color" values="#0f1724;#151c30;#0f1724" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0" />
      <stop offset="45%" stop-color="#7aa2f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)" />
  <rect width="1200" height="4" y="0" fill="url(#glow)" opacity="0.9" />
  <ellipse cx="980" cy="60" rx="120" ry="80" fill="#7aa2f7" opacity="0.12" filter="url(#blur)" />
  <ellipse cx="180" cy="220" rx="100" ry="70" fill="#bb9af7" opacity="0.1" filter="url(#blur)" />
  <text
    x="600"
    y="118"
    text-anchor="middle"
    fill="#c0caf5"
    font-family="Segoe UI, system-ui, -apple-system, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-0.5"
  >
    Bianca Andrade
  </text>
  <text
    x="600"
    y="168"
    text-anchor="middle"
    fill="#7aa2f7"
    font-family="Segoe UI, system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="500"
  >
    Full Stack · Front-End · Acessibilidade &amp; Libras
  </text>
  <text
    x="600"
    y="210"
    text-anchor="middle"
    fill="#565f89"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="16"
  >
    TypeScript · React · Next.js · Node
  </text>
</svg>