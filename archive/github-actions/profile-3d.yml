# Arquivo guardado — não roda no GitHub Actions.
# Para reativar: mova para .github/workflows/profile-3d.yml

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-3d.yml
      - conf/github-profile-3d-contrib.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: biancac-andrade
          SETTING_JSON: conf/github-profile-3d-contrib.json
      - name: Publicar skyline na branch output-3d
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}